name: macOS

on:
  push:
    branches: [master, develop, 'milestone/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.planning/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.planning/**'
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: macos-14
    name: build-arm64 (Xcode ${{ matrix.xcode }})

    strategy:
      fail-fast: false
      matrix:
        xcode: ['16.2']

    env:
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Record the toolchain this image ships
        run: |
          set -eu
          cc --version
          cmake --version
          ninja --version
          sw_vers
          uname -m

      - name: Cache the dependency sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/dependencies.cmake', 'cmake/scene_dependencies.cmake') }}

      # FetchContent reads the base directory from the cache variable, not from the environment.
      - name: Configure
        run: |
          set -eu
          cmake -S . -B build -G Ninja \
            -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_BASE_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DPRAXIS_BUILD_TESTS=ON \
            -DPRAXIS_BUILD_EXAMPLES=ON \
            -DPRAXIS_BUILD_DISPLAY_TESTS=OFF \
            -DPRAXIS_ENABLE_CTAGS_GATES=OFF

      # This image has 7 GB of memory across 3 cores.
      - name: Build
        run: |
          set -eu
          cmake --build build -j 3

      - name: Test
        run: |
          set -eu
          ctest --test-dir build --output-on-failure --no-tests=error

  build-intel:
    runs-on: macos-15-intel

    env:
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record the toolchain this image ships
        run: |
          set -eu
          cc --version
          cmake --version
          ninja --version
          sw_vers
          uname -m

      - name: Confirm the runner is x86_64
        run: |
          set -eu
          arch="$(uname -m)"
          if [ "${arch}" != "x86_64" ]; then
            echo "the runner reports ${arch}, not x86_64; this lane tests nothing" >&2
            exit 1
          fi

      - name: Cache the dependency sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/dependencies.cmake', 'cmake/scene_dependencies.cmake') }}

      - name: Configure
        run: |
          set -eu
          cmake -S . -B build -G Ninja \
            -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_BASE_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DPRAXIS_BUILD_TESTS=ON \
            -DPRAXIS_BUILD_EXAMPLES=ON \
            -DPRAXIS_BUILD_DISPLAY_TESTS=OFF \
            -DPRAXIS_ENABLE_CTAGS_GATES=OFF

      - name: Build
        run: |
          set -eu
          cmake --build build -j 4

      - name: Test
        run: |
          set -eu
          ctest --test-dir build --output-on-failure --no-tests=error
